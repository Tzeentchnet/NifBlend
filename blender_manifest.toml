schema_version = "1.0.0"

id = "nifblend"
version = "0.1.0"
name = "NifBlend"
tagline = "Fast NIF/KF import/export for Bethesda game modding"
maintainer = "NifBlend contributors"
type = "add-on"

# https://docs.blender.org/manual/en/dev/extensions/getting_started.html
blender_version_min = "5.0.0"

license = [
    "SPDX:GPL-3.0-or-later",
]

tags = ["Import-Export"]

# Wheels are populated at build time by `scripts/build_extension.py`.
# numpy is the only runtime dep (Blender ships its own numpy, but pin via wheel
# for reproducibility on minimal Python builds).
wheels = []

[permissions]
files = "Read/write NIF, KF, and texture files referenced by the user"

[build]
# NOTE: Blender's extension builder requires this manifest to sit directly
# alongside `__init__.py`, so the actual build source directory is a staged
# copy of `nifblend/` (see `scripts/build_extension.py`), not the repo root.
# Do NOT add "/scripts/" here: `nifblend/scripts/` ships `blender_export.pas`,
# a runtime resource loaded via `importlib.resources` by the xEdit PAS export
# operator, and would be silently excluded from the shipped package.
paths_exclude_pattern = [
    "__pycache__/",
    "/tests/",
    "*.pyc",
    ".mypy_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
]
